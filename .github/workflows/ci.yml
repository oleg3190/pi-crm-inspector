name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version
        run: |
          test "$(node -p "require('./node_modules/playwright/package.json').version")" = "1.62.1"
          test "$(node -p "require('./node_modules/playwright-core/package.json').version")" = "1.62.1"

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Typecheck & tests
        run: npm run check
